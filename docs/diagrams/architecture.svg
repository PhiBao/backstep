<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="IBM Plex Mono, monospace">
  <rect width="1240" height="560" fill="#FAF7F2"/>
  <text x="40" y="52" font-family="Archivo, sans-serif" font-weight="800" font-size="26" fill="#1A1E1C">BACKSTEP — from footage to evidence</text>
  <text x="40" y="78" font-size="13" fill="#4C554F">One recording becomes a queryable object-state memory. Every answer is validated against the index before it is shown.</text>

  <!-- nodes -->
  <g>
    <rect x="40" y="130" width="180" height="92" rx="6" fill="#1A1E1C"/>
    <text x="58" y="166" font-size="15" fill="#FAF7F2" font-weight="600">1 · RECORDING</text>
    <text x="58" y="190" font-size="12" fill="#D8D0C0">phone video of a</text>
    <text x="58" y="208" font-size="12" fill="#D8D0C0">teardown (.mp4/.mov)</text>

    <rect x="270" y="130" width="180" height="92" rx="6" fill="#fff" stroke="#1A1E1C" stroke-width="2"/>
    <text x="288" y="166" font-size="15" fill="#1A1E1C" font-weight="600">2 · FRAMES</text>
    <text x="288" y="190" font-size="12" fill="#4C554F">ffmpeg · 1 fps · ≤300</text>
    <text x="288" y="208" font-size="12" fill="#4C554F">Rust ingest job (async)</text>

    <rect x="500" y="130" width="210" height="92" rx="6" fill="#0F4C4C"/>
    <text x="518" y="166" font-size="15" fill="#fff" font-weight="600">3 · MUSE SPARK 1.3</text>
    <text x="518" y="190" font-size="12" fill="#DCEeed">Files API video → schema-</text>
    <text x="518" y="208" font-size="12" fill="#DCEeed">constrained parts + steps</text>

    <rect x="760" y="130" width="200" height="92" rx="6" fill="#fff" stroke="#1A1E1C" stroke-width="2"/>
    <text x="778" y="166" font-size="15" fill="#1A1E1C" font-weight="600">4 · MEMORY INDEX</text>
    <text x="778" y="190" font-size="12" fill="#4C554F">SQLite: frames · parts</text>
    <text x="778" y="208" font-size="12" fill="#4C554F">steps · objects · trace</text>

    <rect x="1010" y="130" width="190" height="92" rx="6" fill="#FF5A1F"/>
    <text x="1028" y="166" font-size="15" fill="#fff" font-weight="600">5 · SAM 3.1</text>
    <text x="1028" y="190" font-size="12" fill="#fff">Spark-named concepts →</text>
    <text x="1028" y="208" font-size="12" fill="#fff">boxes + masks on frames</text>
  </g>

  <!-- arrows row 1 -->
  <g stroke="#1A1E1C" stroke-width="2.5" fill="none">
    <path d="M220 176 L262 176"/><path d="M450 176 L492 176"/><path d="M710 176 L752 176"/><path d="M960 176 L1002 176"/>
  </g>
  <g fill="#1A1E1C">
    <path d="M262 176 l-10 -5 v10 z"/><path d="M492 176 l-10 -5 v10 z"/><path d="M752 176 l-10 -5 v10 z"/><path d="M1002 176 l-10 -5 v10 z"/>
  </g>

  <!-- second row -->
  <g>
    <rect x="500" y="290" width="210" height="92" rx="6" fill="#fff" stroke="#1A1E1C" stroke-width="2"/>
    <text x="518" y="326" font-size="15" fill="#1A1E1C" font-weight="600">6 · MUSE WONDER</text>
    <text x="518" y="350" font-size="12" fill="#4C554F">reverse-manual synthesis</text>
    <text x="518" y="368" font-size="12" fill="#4C554F">(Spark fallback, template last)</text>

    <rect x="760" y="290" width="200" height="92" rx="6" fill="#1A1E1C"/>
    <text x="778" y="326" font-size="15" fill="#FAF7F2" font-weight="600">7 · VALIDATION GATE</text>
    <text x="778" y="350" font-size="12" fill="#D8D0C0">Rust: citation ids must</text>
    <text x="778" y="368" font-size="12" fill="#D8D0C0">exist in the index, or refuse</text>

    <rect x="1010" y="290" width="190" height="92" rx="6" fill="#fff" stroke="#FF5A1F" stroke-width="2.5"/>
    <text x="1028" y="326" font-size="15" fill="#1A1E1C" font-weight="600">8 · WORKSPACE</text>
    <text x="1028" y="350" font-size="12" fill="#4C554F">Manual · Finder · Parts</text>
    <text x="1028" y="368" font-size="12" fill="#4C554F">Trace · timeline + overlays</text>
  </g>
  <g stroke="#1A1E1C" stroke-width="2.5" fill="none">
    <path d="M860 222 L860 282"/><path d="M605 290 L605 240 L400 240 L400 222"/>
    <path d="M760 336 L710 336 L710 336"/><path d="M960 336 L1002 336"/>
  </g>
  <g fill="#1A1E1C">
    <path d="M860 282 l-5 -10 h10 z"/><path d="M710 336 l10 -5 v10 z" transform="translate(-14 0)"/><path d="M1002 336 l-10 -5 v10 z"/>
  </g>
  <text x="872" y="258" font-size="11" fill="#4C554F">steps feed synthesis</text>
  <text x="470" y="232" font-size="11" fill="#4C554F">cached by content hash — ingest never re-rolls the dice</text>

  <rect x="40" y="430" width="1160" height="86" rx="6" fill="#EFE9DF" stroke="#D8D0C0"/>
  <text x="60" y="462" font-size="13" fill="#1A1E1C" font-weight="600">Trust model</text>
  <text x="60" y="486" font-size="12" fill="#4C554F">Standard mode only (content never trains Meta models) · API key server-side · uploads capped and type-checked · model answers are</text>
  <text x="60" y="504" font-size="12" fill="#4C554F">proposals until the validation gate cites a real frame, part, step, or SAM object. No citation → “insufficient evidence”, never a guess.</text>
</svg>
